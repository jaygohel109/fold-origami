<style>
:root{
  --panel:#f7f8f6; --panel-2:#eceeeb; --ink:#1b2420; --muted:#5b6862; --line:#d3d9d5;
  --accent:#2b3fa6; --accent-ink:#ffffff; --mat:#23473e; --warn:#a3301f;
  --shadow:0 1px 2px rgba(10,30,20,.18),0 8px 24px rgba(10,30,20,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --panel:#1a201e; --panel-2:#232b28; --ink:#e7ece9; --muted:#9caaa3; --line:#33403b;
  --accent:#93a5ff; --accent-ink:#0f1640; --mat:#16302a; --warn:#ff8a78;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --panel:#1a201e; --panel-2:#232b28; --ink:#e7ece9; --muted:#9caaa3; --line:#33403b;
  --accent:#93a5ff; --accent-ink:#0f1640; --mat:#16302a; --warn:#ff8a78;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--mat);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;font-size:15px;line-height:1.45}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;pointer-events:none;z-index:3;min-width:0}
.bar > *{pointer-events:auto}
/* the logo artwork sits on its own slate background in both themes */
.brand{background:#333d46;border-radius:10px;padding:6px 14px 6px 10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none;min-height:39px}
.brand img{display:block;width:auto}
.brand-word{height:24px}
.brand .brand-logo{height:30px;display:none}
.brand span{color:#c9cfd3;font-size:13px}
.tut-logo{display:block;width:200px;max-width:70%;height:auto;margin:2px auto 12px;border-radius:10px}
.spacer{flex:1}
.group{display:flex;background:var(--panel);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;flex:none}
.group button{background:none;border:0;padding:8px 12px;display:flex;gap:6px;align-items:center;font-size:14px;white-space:nowrap}
.group button + button{border-left:1px solid var(--line)}
.group button:hover{background:var(--panel-2)}
.group button:disabled{opacity:.4;cursor:default;background:none}
.group button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.group svg{width:18px;height:18px;flex:none}

.tools{position:fixed;left:12px;top:calc(70px + env(safe-area-inset-top,0px));width:256px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:8px;z-index:3;max-height:calc(100% - 140px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto}
.toolrow{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;text-align:center;background:none;border:0;border-radius:8px;padding:8px 4px 7px}
.tool-desc{font-size:13px;color:var(--muted);padding:8px 8px 0;line-height:1.35;min-height:2.7em}
.tool:hover{background:var(--panel-2)}
.tool[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.tool[aria-checked="true"] small{color:inherit;opacity:.85}
.tool svg{width:30px;height:30px}
.tool strong{font-weight:500;font-size:13.5px;line-height:1.2}
.tool small{display:none}
.sep{height:1px;background:var(--line);margin:8px 4px}
.field{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 8px;font-size:13.5px}
.field label{color:var(--muted)}
.seg{display:flex;background:var(--panel-2);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:4px 9px;border-radius:6px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.field.stack{flex-wrap:wrap}
.field.stack .seg{width:100%;gap:2px}
.field.stack .seg button{flex:1 1 auto;padding:4px 6px;font-size:12.5px;white-space:nowrap}
select{background:var(--panel-2);border:0;border-radius:6px;padding:4px 6px;font-size:13px}
input[type=range]{width:110px;accent-color:var(--accent)}
input[type=color]{width:30px;height:24px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.colors{display:flex;gap:6px;align-items:center}
.field > select,.field > input[type=range]{flex:0 0 112px;width:112px;min-width:0}
.field label{min-width:0}

.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 18px;box-shadow:var(--shadow);font-size:14px;z-index:3;max-width:calc(100% - 24px);text-align:center;display:flex;gap:10px;align-items:center}
.hint .cancel{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:3px 12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--warn);color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;z-index:4;max-width:min(460px,calc(100% - 24px));opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.info{background:var(--accent);color:var(--accent-ink)}
.bends-head{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-size:13.5px;font-weight:500}
.bends-head button{border:0;background:none;color:var(--accent);font-size:13px;padding:2px 4px}
.bend{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:6px;align-items:center;padding:4px 8px;font-size:13px}
.bend label{color:var(--muted)}
.bend input[type=range]{width:100%;min-width:60px}
.bend output{font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.bend button{border:0;background:var(--panel-2);border-radius:6px;padding:3px;display:flex}
.menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;font-size:14px}
.menu button:hover{background:var(--panel-2)}
.menu small{display:block;color:var(--muted);font-size:12px}
.rel{position:relative;overflow:visible}
.rel > button{border-radius:10px}
.lbl{display:inline}
.tut{position:fixed;right:12px;top:calc(70px + env(safe-area-inset-top,0px));width:320px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px 12px;z-index:3;border:2px solid transparent;transition:border-color .3s}
.tut[hidden]{display:none}
.tut.tut-pass{border-color:#3aa36b}
.tut p{margin:0}
.tut-title{font-weight:700;font-size:15.5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tut-title span{font-weight:400;font-size:13px;color:var(--muted)}
.tut-bar{height:4px;background:var(--panel-2);border-radius:4px;margin:8px 0 10px;overflow:hidden}
.tut-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tut-text{font-size:14.5px;line-height:1.5;margin-top:6px !important}
.tut-note{font-size:13px;color:var(--warn);margin-top:8px !important}
.tut-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tut-actions button{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 12px;font-size:13.5px}
.tut-actions button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.guide{position:fixed;right:12px;top:calc(70px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:360px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);z-index:6;display:flex;flex-direction:column;overflow:hidden}
.guide[hidden]{display:none}
.guide-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.guide-head b{display:block;font-size:15.5px}
.guide-head span{display:block;font-size:13px;color:var(--muted)}
.guide-head button{border:0;background:none;padding:4px;border-radius:6px;display:flex}
.guide-head button:hover{background:var(--panel-2)}
.guide-log{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;font-size:14.5px;line-height:1.5;padding:9px 12px;border-radius:12px;white-space:normal;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--panel-2);border-bottom-left-radius:4px}
.msg.err{align-self:flex-start;background:none;color:var(--warn);padding:0 2px;font-size:13.5px}
.msg img{display:block;max-width:180px;max-height:180px;border-radius:8px;margin-bottom:6px}
.msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msg .acts button{border:1px solid var(--accent);color:var(--accent);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px}
.msg .acts button:hover{background:var(--accent);color:var(--accent-ink)}
.typing{align-self:flex-start;color:var(--muted);font-size:13.5px;padding:0 2px}
.guide-replies{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.guide-replies:empty{display:none}
.guide-replies button{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 12px;font-size:13px}
.guide-replies button:hover{border-color:var(--accent)}
.guide-input{display:flex;align-items:flex-end;gap:6px;padding:10px;border-top:1px solid var(--line)}
.guide-attach{display:flex;padding:8px;border-radius:8px;cursor:pointer;color:var(--muted)}
.guide-attach:hover{background:var(--panel-2);color:var(--ink)}
.guide-field{flex:1;background:var(--panel-2);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;gap:6px}
.guide-field textarea{border:0;background:none;resize:none;font:inherit;font-size:14.5px;color:var(--ink);outline:none;max-height:120px}
#guidethumb:empty{display:none}
#guidethumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
#guidethumb img{width:40px;height:40px;object-fit:cover;border-radius:6px}
#guidethumb button{border:0;background:none;color:var(--accent);font-size:12.5px;padding:0}
#guidesend{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px;display:flex}
#guidesend:disabled{opacity:.4}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.moreset{display:none}
/* top bar: drop the tagline, then the button labels, as the screen narrows */
@media (max-width: 1180px){ .brand span{display:none} }
@media (max-width: 1000px){ .lbl{display:none} .group button{padding:8px 10px} }
/* laptops with short screens: three tools per row so the settings stay in view */
@media (min-width: 761px) and (min-height: 521px) and (max-height: 860px){
  .toolrow{grid-template-columns:repeat(3,1fr);gap:2px}
  .tool{padding:6px 2px 5px;gap:2px}
  .tool svg{width:26px;height:26px}
  .tool strong{font-size:12px}
  .tool-desc{min-height:0;padding-top:6px}
}
/* phones, and any screen too short for the side panel: tools dock at the bottom */
@media (max-width: 760px), (max-height: 520px){
  .guide{left:8px;right:8px;width:auto;top:calc(60px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .tut{left:8px;right:8px;width:auto;max-width:560px;margin:0 auto;top:calc(60px + env(safe-area-inset-top,0px));padding:10px 12px}
  .tut-text{font-size:13.5px}
  .brand span{display:none}
  .lbl{display:none}
  .group button{padding:8px 10px}
  .tools{top:auto;left:8px;right:8px;width:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-height:calc(100vh - 136px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:6px}
  .tools .toolrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:2px}
  .tool-desc{display:none}
  .tool{min-width:0;padding:5px 2px;gap:1px}
  .tool svg{width:24px;height:24px}
  .tool strong{font-size:11.5px;line-height:1.15}
  .sep{display:none}
  .settings{display:none;padding-top:4px}
  .tools.showsettings .settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));column-gap:12px;border-top:1px solid var(--line);margin-top:6px}
  .settings #bends,.settings .field.stack{grid-column:1/-1}
  .moreset{display:flex !important}
  .hint{font-size:12.5px;padding:7px 12px;width:max-content;bottom:calc(12px + env(safe-area-inset-bottom,0px));border-radius:12px}
  .toast{bottom:auto;top:calc(64px + env(safe-area-inset-top,0px))}
}
@media (max-width: 400px){
  .bar{left:8px;right:8px;gap:5px}
  .brand{padding:4px 8px}
  .brand .brand-word{display:none}
  .brand .brand-logo{display:block}
  .group button{padding:8px 7px}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>

<script>
// ===== Origami flat-fold engine =====
const Engine = (() => {
  const TOL = 1e-6;
  let nextId = 1;
  const ap = (T, p) => [T[0]*p[0] + T[1]*p[1] + T[4], T[2]*p[0] + T[3]*p[1] + T[5]];
  const comp = (A, B) => [
    A[0]*B[0] + A[1]*B[2], A[0]*B[1] + A[1]*B[3],
    A[2]*B[0] + A[3]*B[2], A[2]*B[1] + A[3]*B[3],
    A[0]*B[4] + A[1]*B[5] + A[4], A[2]*B[4] + A[3]*B[5] + A[5]];
  const refl = (L) => {
    const [dx, dy] = L.d, [px, py] = L.p;
    const a = 2*dx*dx - 1, b = 2*dx*dy, d = 2*dy*dy - 1;
    return [a, b, b, d, px - (a*px + b*py), py - (b*px + d*py)];
  };
  const side = (L, q) => L.d[0]*(q[1] - L.p[1]) - L.d[1]*(q[0] - L.p[0]);
  const reflPt = (L, q) => ap(refl(L), q);
  const fold = (f) => f.poly.map(v => ap(f.T, v));
  const centroid = (pts) => {
    let x = 0, y = 0; for (const p of pts) { x += p[0]; y += p[1]; }
    return [x / pts.length, y / pts.length];
  };
  const area = (pts) => {
    let s = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i+1) % pts.length]; s += a[0]*b[1] - a[1]*b[0]; }
    return s / 2;

    done: 'That\u2019s a bird base, the shape a crane is folded from.',

  elephant: modelTutorial('Elephant', ELEPHANT, ELE_COLORS, 'Your elephant is finished. Stand it up to see it in 3D, with the trunk curling toward you.'),
  crane: modelTutorial('Crane', CRANE, CRANE_COLORS, 'Your crane is finished. Stand it up to see it with its wings spread.'),
  flower: {
    title: 'Bend into 3D',
    start: () => blintzBase(),
    steps: [
      { text: 'Folds so far lie flat. Bends can stop at any angle. I picked Bend. Drag along the glowing edge, then tap the triangle next to it.',
        setup: () => { setTool('bend'); },
        guide: { line: [[0.5, -0.5], [0.5, 0.5]], tap: [0.3, 0] },
        bend: [{ p: [0.5, -0.5], d: [0, 1] }, [0.3, 0]],
        apply: fs => E.bendSplit(fs, { p: [0.5, -0.5], d: [0, 1] }, 1, 1, f => inPoly([0.3, 0], E.fold(f))).facets, on: 'bend' },
      { text: 'Your bend is listed in the panel on the left. Drag its slider to open the petal wider.', apply: fs => fs, on: 'bend-angle' },
      { text: 'Bend the top petal the same way: drag along the glowing edge, then tap its triangle.',
        setup: () => { setTool('bend'); },
        guide: { line: [[0.5, 0.5], [-0.5, 0.5]], tap: [0, 0.3] },
        bend: [{ p: [0.5, 0.5], d: [-1, 0] }, [0, 0.3]],

let tut = null; // { def, i, canon[] }
const card = $('#tut');
const guideGroup = new THREE.Group(); scene.add(guideGroup);
function clearGuide() { while (guideGroup.children.length) { const c = guideGroup.children.pop(); c.geometry.dispose(); } }
function drawGuide(g) {
  clearGuide(); if (!g) return;
  const z = topZ() + 0.002;
  const ring = (p, col) => { const m = new THREE.Mesh(new THREE.RingGeometry(0.045, 0.075, 32), ovMat(col, 0.95)); m.position.set(p[0], p[1], z); m.renderOrder = 12; m.userData.pulse = true; guideGroup.add(m); };
  if (g.pts) g.pts.forEach((p, i) => ring(p, i === 0 ? 0xffd447 : 0xffffff));
  if (g.line) {
    const [a, b] = g.line, d = norm([b[0]-a[0], b[1]-a[1]]), w = 0.016, nx = -d[1]*w, ny = d[0]*w;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([a[0]+nx,a[1]+ny,0, b[0]+nx,b[1]+ny,0, b[0]-nx,b[1]-ny,0, a[0]+nx,a[1]+ny,0, b[0]-nx,b[1]-ny,0, a[0]-nx,a[1]-ny,0], 3));
    const l = new THREE.Mesh(geo, ovMat(0xffd447, 0.9)); l.position.z = z; l.renderOrder = 12; guideGroup.add(l);
    ring(g.line[0], 0xffd447); ring(g.line[1], 0xffd447);
  }
  if (g.tap) { const m = new THREE.Mesh(new THREE.CircleGeometry(0.05, 28), ovMat(0xffffff, 0.75)); m.position.set(g.tap[0], g.tap[1], z); m.renderOrder = 12; m.userData.pulse = true; guideGroup.add(m); }
}
function renderCard(extra) {
  if (!tut) { card.hidden = true; return; }
  card.hidden = false;
  const { def, i } = tut, n = def.steps.length;
  if (i >= n) {
    card.innerHTML = `<p class="tut-title">${def.title}</p><p class="tut-text">${def.done}</p>
      <div class="tut-actions"><button class="primary" data-t="close">Start folding</button>${def === TUTORIALS.basics ? '<button data-t="next-tut">Try squash folds</button>' : ''}${def.model ? '<button data-t="look">Stand it up</button>' : ''}</div>`;
    return;
  }
  card.innerHTML = `<p class="tut-title">${def.title}<span>Step ${i + 1} of ${n}</span></p>
    <div class="tut-bar"><i style="width:${(i / n) * 100}%"></i></div>
    <p class="tut-text">${def.steps[i].text}</p>
    ${extra ? `<p class="tut-note">${extra}</p>` : ''}
    <div class="tut-actions">${def.steps[i].on === 'auto' ? '' : '<button class="primary" data-t="show">Show me</button>'}<button data-t="close">Exit tutorial</button></div>`;
}
card.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const a = b.dataset.t;
  if (a === 'close') endTutorial();
  if (a === 'next-tut') startTutorial('squash');
  if (a === 'show') showMe();
  if (a === 'look') { endTutorial(); setStanding(true); }
});
function enterStep() {
  cancel();
  const st = tut.def.steps[tut.i];
  if (!st) { clearGuide(); renderCard(); return; }
  if (st.setup) st.setup();
  const g = typeof st.guide === 'function' ? st.guide(tut.canon[tut.i]) : st.guide;
  extraSnaps = g ? [...(g.pts || []), ...(g.line || [])] : [];
  drawGuide(g);
  renderCard();
  if (st.on === 'auto') setTimeout(() => { if (tut && tut.def.steps[tut.i] === st) commit({ facets: st.apply(facets) }, 800, 'auto'); }, 700);
}
async function startTutorial(name) {
  if (busy) return;
  if (viewMode) setView(false);
  const def = TUTORIALS[name];
  const canon = [def.start()];
  def.steps.forEach((st, k) => canon.push(st.apply(canon[k])));
  tut = { def, i: 0, canon };
  if (def.colors) setColors(def.colors);
  history.push(snapshot()); future = [];
  await applyResult(canon[0], false);
  resetView();
  enterStep();
}
function endTutorial() { tut = null; extraSnaps = []; clearGuide(); renderCard(); }
function advance() {
  const target = tut.canon[tut.i + 1];
  if (target && !sameBox(facets, target)) applyResult(target, false, 0, bends);
  tut.i++;
  card.classList.add('tut-pass'); setTimeout(() => card.classList.remove('tut-pass'), 500);
  enterStep();
}
notify = (evt) => {
  if (!tut || tut.i >= tut.def.steps.length) return;
  const st = tut.def.steps[tut.i];
  if (st.on !== evt) return;
  if (evt === 'fold') {
    if (sameSig(sig(facets), sig(tut.canon[tut.i + 1]))) advance();
    else renderCard('That\u2019s a different fold. Press Undo and try again, or press Show me.');
  } else if (evt === 'undo') {
    if (facets.length === 1) advance();
  } else advance();
};
async function showMe() {
  if (busy || !tut) return;
  const st = tut.def.steps[tut.i];
  cancel();
  if (st.on === 'undo') { if (history.length) undo(); else advance(); return; }
  if (st.on === 'bend') { const [L, tap] = st.bend; await addBend(L, Math.sign(E.side(L, tap)), seedAt(tap), st.bendAngle || 90, st.bendDir || 1, true, st.wing ? wingSet(facets, L, st.wing) : undefined); return; }
  if (st.on === 'bend-angle') {
    const b = bends[bends.length - 1]; if (!b) { advance(); return; }
    const a0 = b.angle, t0 = performance.now(); busy = true;
    await new Promise(res => { const f = (t) => { const u = Math.min(1, (t - t0) / 700); b.angle = a0 + (140 - a0) * ease(u); poseAll(null, 1); if (u < 1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
    busy = false; renderBends(); notify('bend-angle'); return;
  }
  if (st.on === 'view-off') {
    setView(true);
    const from = camera.position.clone(), t0 = performance.now();
    await new Promise(res => { const f = (t) => { const u = Math.min(1, (t - t0) / 1400); camera.position.set(from.x, from.y - Math.sin(u * Math.PI) * 3.2, from.z - Math.sin(u * Math.PI) * 1.2); camera.lookAt(0, 0, 0); if (u < 1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
    setView(false); return;
  }
  const prev = tut.canon[tut.i];
  if (!sameBox(facets, prev) || facets.length !== prev.length) await applyResult(prev, false);
  const res = st.on === 'turn' ? E.turnOver(facets) : { facets: st.apply(facets) };
  const r = st.on === 'fold' ? { facets: st.apply(facets) } : res;
  await commit(r, tool === 'squash' ? 1300 : 800, st.on);
}
$('#learn').addEventListener('click', (e) => { e.stopPropagation(); const m = $('#learnmenu'); const o = m.classList.toggle('open'); $('#learn').setAttribute('aria-expanded', o); });
document.addEventListener('click', () => { $('#learnmenu').classList.remove('open'); $('#learn').setAttribute('aria-expanded', false); });
$('#learnmenu').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) startTutorial(b.dataset.tut); });
(function animateGuide() {
  const s = 1 + 0.18 * Math.sin(performance.now() / 260);
  guideGroup.children.forEach(c => { if (c.userData.pulse) c.scale.set(s, s, 1); c.position.z = topZ() + 0.002; });
  requestAnimationFrame(animateGuide);
})();
// first visit: offer the basics
let seen = false; try { seen = localStorage.getItem('fold-tour-seen') === '1'; localStorage.setItem('fold-tour-seen', '1'); } catch (e) {}
if (!seen) {
  card.hidden = false;
  card.innerHTML = `${card.dataset.logo ? `<img class="tut-logo" src="${card.dataset.logo}" alt="kamigami, online paper fold workbench">` : ''}<p class="tut-title">New to Kamigami?</p><p class="tut-text">A five-step tour shows you how to crease, fold, undo, and look around. It takes about a minute.</p>
    <div class="tut-actions"><button class="primary" data-t2="go">Take the tour</button><button data-t2="no">No thanks</button></div>`;
  card.addEventListener('click', function once(e) {
    const b = e.target.closest('button[data-t2]'); if (!b) return;
    card.removeEventListener('click', once);
    if (b.dataset.t2 === 'go') startTutorial('basics'); else card.hidden = true;
  });
}


// ---------- fold guide (AI chat) ----------
// Switched off for now: no API key yet and no content guard rails. Set to true to bring it back
// (the server function also needs FOLD_GUIDE_ENABLED=true).
const GUIDE_ENABLED = false;
const GUIDE_URL = '/api/fold-guide';
if (!GUIDE_ENABLED) $('#guidebtn').parentElement.style.display = 'none';
const guide = $('#guide'), glog = $('#guidelog'), gform = $('#guideform'), gtext = $('#guidetext'), greplies = $('#guidereplies');
let gHistory = [], gImage = null, gBusy = false;
try { gHistory = JSON.parse(localStorage.getItem('fold-guide-chat') || '[]'); } catch (e) { gHistory = []; }
const gSave = () => { try { localStorage.setItem('fold-guide-chat', JSON.stringify(gHistory.slice(-30).map(m => ({ role: m.role, text: m.text, actions: m.actions })))); } catch (e) {} };
const escHtml = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (s) => escHtml(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const TOOL_NAMES = { valley: 'Valley', mountain: 'Mountain', inside: 'Inside reverse', outside: 'Outside reverse', sink: 'Sink', squash: 'Squash', petal: 'Petal', bend: 'Bend', pull: 'Pull out' };
function actionLabel(a) {
  if (a.label) return String(a.label).slice(0, 40);
  if (a.type === 'tool') return 'Select ' + (TOOL_NAMES[a.value] || a.value);
  if (a.type === 'tutorial') return 'Start the tutorial';
  if (a.type === 'demo') return 'Show me';
  return String(a.value);
}
function runAction(a) {
  const v = String(a.value);
  if (a.type === 'tool' && TOOL_NAMES[v]) setTool(v);
  else if (a.type === 'method' && (v === 'line' || v === 'p2p' || v === 'e2l')) setMethod(v);
  else if (a.type === 'layers' && ['0','1','2','3','4','6','-1','-2'].includes(v)) $('#layers').value = v;
  else if (a.type === 'tutorial' && TUTORIALS[v]) { closeGuide(); startTutorial(v); }
  else if (a.type === 'demo' && DEMOS[v]) { closeGuide(); endTutorial(); demo(v); }
  else if (a.type === 'command') {
    if (v === 'undo') undo();
    else if (v === 'turn') turnOver();
    else if (v === 'rotate') rotate45();
    else if (v === 'look') setView(!viewMode);
    else if (v === 'stand') setStanding(!standing);
    else if (v === 'new' && !busy) { history.push(snapshot()); future = []; applyResult(blankSheet(), false); }
  }
  else if (a.type === 'shape' && SHAPES[v]) setShape(v);
  if (window.matchMedia('(max-width: 760px)').matches && (a.type === 'tool' || a.type === 'command')) closeGuide();
}
function renderMsg(m) {
  const d = document.createElement('div');
  d.className = 'msg ' + (m.role === 'user' ? 'user' : m.role === 'error' ? 'err' : 'bot');
  d.innerHTML = (m.img ? `<img src="${m.img}" alt="Diagram you shared">` : '') + fmt(m.text || '');
  if (m.actions && m.actions.length) {
    const acts = document.createElement('div'); acts.className = 'acts';
    for (const a of m.actions) { const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = actionLabel(a); btn.addEventListener('click', () => runAction(a)); acts.appendChild(btn); }
    d.appendChild(acts);
  }
  glog.appendChild(d); glog.scrollTop = glog.scrollHeight;
}
function setReplies(list) {
  greplies.innerHTML = '';
  for (const r of (list || []).slice(0, 3)) { const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = r; btn.addEventListener('click', () => sendGuide(r)); greplies.appendChild(btn); }
}
function guideIntro() {
  glog.innerHTML = '';
  if (!gHistory.length) {
    renderMsg({ role: 'assistant', text: 'Hi! Tell me what you\u2019d like to fold, like a boat, a frog or a heart, or share a picture of a diagram you found. I\u2019ll take you through it one step at a time and tell you which tool to use.' });
    setReplies(['Fold a paper boat', 'Fold a crane', 'What can I make here?']);
  } else gHistory.forEach(renderMsg);
}
function openGuide() { if (!GUIDE_ENABLED) return; guide.hidden = false; $('#guidebtn').setAttribute('aria-expanded', true); if (!glog.children.length) guideIntro(); setTimeout(() => gtext.focus(), 50); }
function closeGuide() { guide.hidden = true; $('#guidebtn').setAttribute('aria-expanded', false); }
$('#guidebtn').addEventListener('click', () => guide.hidden ? openGuide() : closeGuide());
$('#guideclose').addEventListener('click', closeGuide);
gtext.addEventListener('input', () => { gtext.style.height = 'auto'; gtext.style.height = Math.min(120, gtext.scrollHeight) + 'px'; });
gtext.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); gform.requestSubmit(); } });
gform.addEventListener('submit', (e) => { e.preventDefault(); sendGuide(gtext.value); });
$('#guidefile').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    const s = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', 0.85);
    gImage = { url, data: url.split(',')[1] };
    $('#guidethumb').innerHTML = `<img src="${url}" alt=""><span>Diagram attached</span><button type="button" id="guiderm">Remove</button>`;
    $('#guiderm').addEventListener('click', () => { gImage = null; $('#guidethumb').innerHTML = ''; });
  } catch (err) { renderMsg({ role: 'error', text: 'That image couldn\u2019t be read. Try a PNG or JPEG.' }); }
});
function appContext() {
  return { tool, method, layers: $('#layers').value, shape, folds: history.length, bends: bends.length, viewMode, standing,
    tutorial: tut ? tut.def.title + ' step ' + (tut.i + 1) : null };
}
const G_ERRORS = {
  not_configured: 'The fold guide isn\u2019t switched on for this site yet. (Site owner: add ANTHROPIC_API_KEY in Netlify \u2192 Project configuration \u2192 Environment variables, then redeploy.)',
  rate_limited: 'That\u2019s a lot of questions in a short time. Wait a few minutes and try again.',
  bad_key: 'The fold guide\u2019s API key was rejected. (Site owner: check ANTHROPIC_API_KEY in Netlify.)',
};
async function sendGuide(text) {
  text = String(text || '').trim();
  if (!GUIDE_ENABLED || gBusy || (!text && !gImage)) return;
  const user = { role: 'user', text: text || 'Here\u2019s the diagram I want to fold.', img: gImage && gImage.url };
  const imgData = gImage && gImage.data;
  gImage = null; $('#guidethumb').innerHTML = ''; gtext.value = ''; gtext.style.height = 'auto'; setReplies([]);
  renderMsg(user); gHistory.push({ role: 'user', text: user.text });
  gBusy = true; $('#guidesend').disabled = true;
  const typing = document.createElement('div'); typing.className = 'typing'; typing.textContent = 'Thinking about the folds\u2026'; glog.appendChild(typing); glog.scrollTop = glog.scrollHeight;
  // send text history; the newest message carries the image if one was attached
  const messages = gHistory.filter(m => m.role === 'user' || m.role === 'assistant').slice(-14).map(m => ({ role: m.role, content: m.text }));
  if (imgData) { gLastImage = imgData; }
  if (gLastImage) {
    const last = messages[messages.length - 1];
    last.content = [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: gLastImage } }, { type: 'text', text: last.content }];
  }
  try {
    const r = await fetch(GUIDE_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ messages, context: appContext() }) });
    let data = null; try { data = await r.json(); } catch (e) {}
    typing.remove();
    if (!r.ok || !data || data.error) {
      const msg = (data && G_ERRORS[data.error]) || (r.status === 404 ? G_ERRORS.not_configured : 'The fold guide couldn\u2019t answer just now. Try again in a moment.');
      renderMsg({ role: 'error', text: msg }); gHistory.pop(); gSave();
    } else {
      const bot = { role: 'assistant', text: data.message || '', actions: (data.actions || []).filter(a => a && a.type && a.value != null) };
      renderMsg(bot); gHistory.push(bot); gSave(); setReplies(data.replies);
    }
  } catch (e) {
    typing.remove(); renderMsg({ role: 'error', text: 'You seem to be offline, so the fold guide can\u2019t reach the server.' }); gHistory.pop();
  }
  gBusy = false; $('#guidesend').disabled = false;
}
let gLastImage = null;

// ---------- loop ----------
buildMeshes(); updateButtons(); hint();
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
window.__fold = { E, get bends() { return bends; }, ws: (L, w) => wingSet(facets, L, w), st: (n) => startTutorial(n), show: (fs, nb) => applyResult(fs, false, 0, nb), get facets() { return facets; }, inPoly };
})();
